name: Build Desktop Application (Windows & Linux)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "BostaOrderManager" --windowed --noconfirm --add-data "bosta_locations.json;." --add-data "Bosta_Template_Clean.xlsx;." --add-data "Bosta Upload Template AR V3.5.xlsx;." app.py
          copy "Bosta_Template_Clean.xlsx" "dist\BostaOrderManager\"
          copy "Bosta Upload Template AR V3.5.xlsx" "dist\BostaOrderManager\"
          copy "bosta_locations.json" "dist\BostaOrderManager\"

      - name: Compress Windows Build
        run: |
          powershell Compress-Archive -Path dist\BostaOrderManager -DestinationPath BostaOrderManager-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BostaOrderManager-Windows-x64
          path: BostaOrderManager-Windows-x64.zip

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "BostaOrderManager" --windowed --noconfirm --add-data "bosta_locations.json:." --add-data "Bosta_Template_Clean.xlsx:." --add-data "Bosta Upload Template AR V3.5.xlsx:." app.py
          cp Bosta_Template_Clean.xlsx "Bosta Upload Template AR V3.5.xlsx" bosta_locations.json dist/BostaOrderManager/
          tar -czvf BostaOrderManager-Linux-x64.tar.gz -C dist BostaOrderManager

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BostaOrderManager-Linux-x64
          path: BostaOrderManager-Linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: BostaOrderManager-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: BostaOrderManager-Linux-x64

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: "Bosta Smart Order Manager ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}"
          body: |
            ## 🚀 إطلاق مدير أوردرات بوسطة الذكي (Bosta Smart Order Manager) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
            
            ### 📦 التحميل:
            - **نسخة ويندوز (Windows):** قم بتحميل `BostaOrderManager-Windows-x64.zip` وفك الضغط وتشغيل `BostaOrderManager.exe`.
            - **نسخة لينكس (Linux):** قم بتحميل `BostaOrderManager-Linux-x64.tar.gz` وفك الضغط وتشغيل `BostaOrderManager`.
            
            ### ✨ التحديثات الجديدة في هذا الإصدار:
            - **العمود N (وصف الشحنة):** المنتجات والكميات فقط مع استبعاد كافة الأكواد والـ SKU تلقائياً.
            - **العمود L (قيمة التحصيل):** السعر يسجل كرقم صافٍ بدقة.
            - **إزالة كود الطلب تماماً:** إزالة توليد أكواد الطلبات والمرجع من كافة الأعمدة والواجهة.
            - فحص وتطهير وتطابق كامل مع قالب بوسطة الرسمي V3.5.
            - كشف البيانات المتكررة وفحص الهواتف المصرية وتصدير الشيت ليوم محدد.
          files: |
            BostaOrderManager-Windows-x64.zip
            BostaOrderManager-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
